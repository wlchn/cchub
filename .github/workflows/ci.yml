name: CI

# 2026-09-14：暂时停掉 push / pull_request 自动触发，只保留手动触发。
# 原因：推送后 CI 会失败，在定位清楚之前不想让它刷屏。恢复自动触发只需
# 把下面两行取消注释（原本不按分支过滤：默认分支名若与预期不符，写死分支
# 会让 CI 静默不跑；分支多了嫌吵时再收窄成 branches: [main]）。
on:
  # push:
  # pull_request:
  workflow_dispatch:

# 同一分支上的旧运行没必要跑完，新推送直接取代它
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端：`pnpm build` = tsc --noEmit && vite build。
  # tsc 这关同时兜住 i18n —— 词典是类型化的，拼错键、漏加键在类型检查阶段就会报。
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json 里没写 packageManager，这里显式钉版本
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # tsc 只对着 zh-CN 查类型，en-US 缺键要靠这一步兜住
      - run: pnpm check:locales
      # 后端消息 → 界面文案的翻译链路（含未知码与原始输出的回落）
      - run: pnpm test:messages
      - run: pnpm build

  # Rust：单元测试。`tauri` 带默认 wry/webkit features，Linux 上必须先装系统依赖
  # 才能编译；清单取自 Tauri v2 官方文档。
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      # 不需要先构建前端：dev profile 下 tauri-build 不要求 frontendDist 存在
      - run: cargo test
        working-directory: src-tauri
